services:
  bp-app:
    build: .
    image: bp-app:latest
    container_name: bp-app
    restart: unless-stopped
    ports:
      - "8288:8000"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - BP_DATA_DIR=/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 6s
      start_period: 25s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
